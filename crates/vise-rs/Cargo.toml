[package]
name = "vise-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
bytes = "1"
http-body-util = "0.1"

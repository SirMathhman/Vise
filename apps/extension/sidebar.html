<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vise</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font:
          13px system-ui,
          sans-serif;
        color: #e6e6e6;
        background: #15171c;
      }
      #strip {
        padding: 6px 8px;
        border-bottom: 1px solid #333;
      }
      #strip button {
        font: inherit;
        cursor: pointer;
      }
      #badge {
        padding: 5px 8px;
        border-radius: 5px;
        margin-bottom: 6px;
      }
      #badge.ok {
        background: #1d3a26;
        color: #8fe3a4;
      }
      #badge.warn {
        background: #3d3519;
        color: #f0d77a;
      }
      #badge.bad {
        background: #44211f;
        color: #ffb3ad;
      }
      #badge-text {
        font-weight: 600;
      }
      #badge-help {
        font-size: 12px;
        margin-top: 2px;
      }
      #checks {
        font-size: 12px;
        color: #9aa0a6;
        margin-bottom: 4px;
      }
      #current {
        color: #9aa0a6;
        margin-bottom: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #notice {
        margin-top: 6px;
        padding: 3px 6px;
        border-radius: 4px;
      }
      #notice.ok {
        background: #1d3a26;
        color: #8fe3a4;
      }
      #notice.error {
        background: #44211f;
        color: #ffb3ad;
      }
      #owned {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }
      #owned li {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 1px 0;
      }
      #owned span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }
      #offline {
        padding: 16px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="strip">
      <div id="badge" class="bad" role="status">
        <div id="badge-text">✕ Not connected to Vise</div>
        <div id="badge-help"></div>
      </div>
      <div id="checks"></div>
      <div id="current"></div>
      <button id="give" title="Let Vise use the tab you are looking at">Give Vise this tab</button>
      <button id="repair" hidden title="Forget the stored pairing token and pair again">
        Re-pair
      </button>
      <div id="notice" role="status" hidden></div>
      <ul id="owned"></ul>
    </div>
    <div id="offline" hidden>
      Vise is not running. Start it with <code>bun run web</code>.
      <button id="retry">retry</button>
    </div>
    <iframe id="app" hidden title="Vise"></iframe>
    <script src="dist/sidebar.js"></script>
  </body>
</html>

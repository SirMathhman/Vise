<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vise</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Vise</h1>
      <p id="greeting">Loading…</p>
      <section class="status">
        <h2>Backend</h2>
        <p id="health">Checking…</p>
        <button id="refresh" type="button">Refresh</button>
      </section>
      <section class="status">
        <h2>OpenRouter models</h2>
        <p id="models-status">Loading…</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Context</th>
                <th>Prompt / 1M</th>
                <th>Completion / 1M</th>
              </tr>
            </thead>
            <tbody id="models-body"></tbody>
          </table>
        </div>
      </section>
      <section class="status">
        <h2>OpenRouter API key</h2>
        <p id="key-status">Checking…</p>
        <form id="key-form">
          <input id="key-input" type="password" autocomplete="off" placeholder="Paste API key" />
          <button type="submit">Save</button>
          <button id="key-clear" type="button">Clear</button>
        </form>
        <p id="key-error" role="alert"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

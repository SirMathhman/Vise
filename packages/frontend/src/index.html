<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vise</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Vise</h1>
      <p id="greeting">Loading…</p>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="chat" aria-pressed="true">Chat</button>
        <button type="button" data-tab="models" aria-pressed="false">
          Models
        </button>
        <button type="button" data-tab="key" aria-pressed="false">Key</button>
        <button type="button" data-tab="backend" aria-pressed="false">
          Backend
        </button>
      </nav>
      <section class="status chat" data-tab-panel="chat">
        <h2>Chat</h2>
        <label for="model-input">Model</label>
        <input
          id="model-input"
          list="model-options"
          autocomplete="off"
          placeholder="Search for a model"
        />
        <datalist id="model-options"></datalist>
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <label for="chat-message">Message</label>
        <textarea id="chat-message" rows="2"></textarea>
        <div class="row">
          <button id="chat-send" type="button">Send</button>
          <button id="chat-new" type="button">New conversation</button>
        </div>
        <p id="chat-status" role="status"></p>
      </section>
      <section class="status" data-tab-panel="models" hidden>
        <h2>OpenRouter models</h2>
        <p id="models-status">Loading…</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Vendor</th>
                <th>Name</th>
                <th>Context</th>
                <th>Prompt / 1M</th>
                <th>Completion / 1M</th>
              </tr>
            </thead>
            <tbody id="models-body"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="models-prev" type="button">Prev</button>
          <span id="models-page"></span>
          <button id="models-next" type="button">Next</button>
        </div>
      </section>
      <section class="status" data-tab-panel="key" hidden>
        <h2>OpenRouter API key</h2>
        <p id="key-status">Checking…</p>
        <form id="key-form">
          <input
            id="key-input"
            type="password"
            autocomplete="off"
            placeholder="Paste API key"
          />
          <button type="submit">Save</button>
          <button id="key-clear" type="button">Clear</button>
        </form>
        <p id="key-error" role="alert"></p>
      </section>
      <section class="status" data-tab-panel="backend" hidden>
        <h2>Backend</h2>
        <p id="health">Checking…</p>
        <button id="refresh" type="button">Refresh</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

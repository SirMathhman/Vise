<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vise</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/marked.umd.js"></script>
    <script src="/purify.min.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <span class="brand">Vise</span>
        <span id="conn-state" class="conn-state" title="WebSocket status">
          connecting&hellip;
        </span>
      </header>

      <section id="sessions" class="sessions">
        <details>
          <summary>sessions</summary>
          <div id="sessions-body">
            <div id="sessions-save-row" class="sessions-save-row">
              <input
                id="session-name-input"
                class="session-name-input"
                type="text"
                placeholder="save current as&hellip;"
              />
              <button id="session-save-btn" type="button">Save</button>
              <button
                id="session-refresh-btn"
                type="button"
                title="Refresh saved sessions"
              >
                &#8635;
              </button>
            </div>
            <ul id="sessions-list" class="sessions-list">
              <li class="sessions-empty">
                Click refresh (&#8635;) to load saved sessions.
              </li>
            </ul>
          </div>
        </details>
      </section>

      <main id="chat">
        <div id="status-line" class="status-line" hidden></div>
        <div id="messages"></div>
      </main>

      <section id="diagnostics" class="diagnostics">
        <details>
          <summary>diagnostics &amp; tool details</summary>
          <div id="diagnostics-body"></div>
        </details>
      </section>

      <footer id="composer">
        <div id="question" class="question" hidden></div>
        <div id="log-area" class="log-area" hidden></div>
        <div id="error-area" class="error-area" hidden></div>
        <div id="command-area" class="command-area" hidden></div>
        <div id="hook-area" class="hook-area" hidden></div>
        <div id="compact-notice" class="compact-notice" hidden></div>
        <div id="input-row">
          <textarea
            id="input"
            class="input"
            rows="1"
            placeholder="Send a message (Enter to send, Shift+Enter for a new line)"
          ></textarea>
          <button id="send" type="button">Send</button>
        </div>
      </footer>
    </div>
  </body>
</html>

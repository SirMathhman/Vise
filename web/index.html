<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="bar">
        <span class="brand">vise</span>
        <select id="model" class="model" title="Switch model">
          <option value="">loading…</option>
        </select>
        <select id="profile" class="model" title="Switch profile">
          <option value="">loading…</option>
        </select>
        <select id="reasoning" class="model" title="Set the reasoning effort">
          <option value="">loading…</option>
        </select>
        <button id="tools-btn" class="tools-btn" title="Toggle tools panel">
          tools
        </button>
        <button
          id="burst-btn"
          class="tools-btn"
          aria-pressed="false"
          title="Burst mode: think once to plan, then run tool calls without thinking"
        >
          burst
        </button>
        <span id="status" class="status"></span>
        <button id="stop" class="stop" title="Interrupt the current turn">
          stop
        </button>
        <button
          id="profiles-btn"
          class="tools-btn"
          title="Edit profiles (tool whitelists)"
        >
          profiles
        </button>
        <button
          id="sessions-btn"
          class="tools-btn"
          title="Toggle sessions panel"
        >
          sessions
        </button>
        <div id="tools-panel" class="tools-panel hidden">
          <ul id="tools-list" class="tools-list"></ul>
        </div>
        <div id="profiles-panel" class="tools-panel hidden">
          <select id="pe-profile" class="model" title="Profile to edit"></select>
          <div class="pe-bulk">
            <button id="pe-check-all" class="tools-btn">check all</button>
            <button id="pe-uncheck-all" class="tools-btn">uncheck all</button>
          </div>
          <ul id="pe-tools" class="tools-list"></ul>
          <div class="save-row">
            <button id="pe-save" class="save-btn">save</button>
          </div>
        </div>
        <div id="sessions-panel" class="tools-panel hidden">
          <ul id="sessions-list" class="tools-list"></ul>
          <div class="save-row">
            <input
              id="save-name"
              class="save-input"
              type="text"
              placeholder="session name…"
              autocomplete="off"
            />
            <button id="save-btn" class="save-btn">save</button>
          </div>
        </div>
      </header>
      <section id="log" class="log" aria-live="polite"></section>
      <footer class="context-bar">
        <span id="context" class="context"></span>
      </footer>
      <section class="composer">
        <div id="ask" class="ask hidden">
          <div id="ask-question" class="ask-question"></div>
          <ul id="ask-options" class="ask-options"></ul>
          <div class="ask-row">
            <input
              id="ask-answer"
              class="ask-answer"
              type="text"
              placeholder="or type a reply…"
            />
            <button id="ask-send" class="ask-send">send</button>
          </div>
        </div>
        <div class="composer-input-wrap">
          <ul
            id="command-suggestions"
            class="command-suggestions hidden"
            role="listbox"
            aria-label="Slash command suggestions"
          ></ul>
          <div class="composer-row">
            <input
              id="input"
              class="input"
              type="text"
              placeholder="type a message… (Enter to send, Shift+Enter for a newline)"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="command-suggestions"
              aria-expanded="false"
            />
            <button id="send" class="send">send</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="dist/app.js"></script>
  </body>
</html>

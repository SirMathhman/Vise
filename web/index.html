<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata Chat</title>
    <style>
      /* Colors are set once here. Native form controls follow the same scheme, so they match the page in both themes. */
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #111;
        --muted: #666;
        --line: #ddd;
        --rule: #bbb;
        --grid: #ccc;
        --surface: #f3f3f3;
        --code: #ececec;
        --user: #e8f0fe;
        --assistant: #f3f3f3;
        --error-bg: #fde7e7;
        --error-fg: #8a1c1c;
        --mono: ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1b;
          --fg: #eee;
          --muted: #aaa;
          --line: #444;
          --rule: #555;
          --grid: #555;
          --surface: #222;
          --code: #333;
          --user: #263247;
          --assistant: #2a2a2a;
          --error-bg: #4a1f1f;
          --error-fg: #ffb4b4;
        }
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .layout {
        display: flex;
        height: 100vh;
      }
      main {
        flex: 1;
        min-width: 24rem;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 48rem;
        margin: 0 auto;
        padding: 1rem;
        box-sizing: border-box;
      }
      #log {
        flex: 1;
        overflow-y: auto;
      }
      #log > div {
        margin: 0.5rem 0;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        white-space: pre-wrap;
      }
      .user {
        background: var(--user);
      }
      .assistant {
        background: var(--assistant);
      }
      .thinking {
        margin-bottom: 0.5rem;
        color: var(--muted);
        font-size: 0.9em;
      }
      .thinking > div {
        white-space: pre-wrap;
      }
      .summary {
        color: var(--muted);
        font-size: 0.85em;
        font-style: italic;
      }
      .description {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.85em;
      }
      .tool {
        font-family: var(--mono);
        font-size: 0.85em;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .subagent {
        margin: 0.5rem 0;
        padding: 0.25rem 0.75rem;
        border-left: 3px solid var(--rule);
        font-size: 0.95em;
      }
      .subagent > summary {
        color: var(--muted);
        cursor: pointer;
      }
      .markdown {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .markdown p {
        margin: 0.4rem 0;
      }
      .markdown h1,
      .markdown h2,
      .markdown h3 {
        font-size: 1.1em;
        margin: 0.6rem 0 0.3rem;
      }
      .markdown code {
        font-family: var(--mono);
        font-size: 0.9em;
        background: var(--code);
        padding: 0 0.2em;
        border-radius: 0.2rem;
      }
      /* Code blocks wrap like the rest of the reply, so the chat log is the only thing that scrolls. */
      .markdown pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 0.5rem;
        background: var(--code);
        border-radius: 0.4rem;
      }
      .markdown pre code {
        background: none;
        padding: 0;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 1.4rem;
      }
      .markdown blockquote {
        margin: 0.4rem 0;
        padding-left: 0.6rem;
        border-left: 3px solid var(--rule);
        color: var(--muted);
      }
      .markdown table {
        border-collapse: collapse;
      }
      .markdown th,
      .markdown td {
        border: 1px solid var(--grid);
        padding: 0.2rem 0.4rem;
      }
      .error {
        background: var(--error-bg);
        color: var(--error-fg);
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      /* One look for every text field and button. Checkboxes keep their native look. */
      button,
      input:not([type="checkbox"]),
      select,
      textarea {
        font: inherit;
        color: var(--fg);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.3rem;
      }
      button {
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        padding: 0.4rem 0.5rem;
        box-sizing: border-box;
      }
      #input {
        flex: 1;
        min-width: 0;
      }
      #divider {
        width: 6px;
        flex-shrink: 0;
        cursor: col-resize;
        touch-action: none;
        background: var(--line);
      }
      aside {
        width: var(--tools-width, 17rem);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
        border-left: 1px solid var(--line);
      }
      /* The Tools, Sessions and Notes panes share the height of the side panel, and each scrolls on its own. */
      .pane {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding: 0 1rem 1rem;
        box-sizing: border-box;
        border-top: 1px solid var(--line);
      }
      /* A closed section is only its heading, so it takes no more height than that. */
      .pane:not([open]) {
        flex: none;
        overflow: visible;
        padding-bottom: 0;
      }
      .pane > summary {
        padding: 0.75rem 0;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .pane:first-child {
        border-top: 0;
      }
      #tools-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #tools-list li {
        margin: 0.75rem 0;
      }
      #tools-list label {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        font-family: var(--mono);
        font-size: 0.9em;
      }
      #tools-list .description {
        margin-left: 1.5rem;
      }
      #tools-error {
        margin: 0 0 0.5rem;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }
      #files-tree {
        margin-top: 0.5rem;
        font-family: var(--mono);
        font-size: 0.85em;
      }
      #files-tree ul {
        list-style: none;
        margin: 0;
        padding-left: 1rem;
      }
      #files-tree > ul {
        padding-left: 0;
      }
      #files-tree li {
        margin: 0.15rem 0;
      }
      #files-tree summary {
        cursor: pointer;
      }
      .file-link {
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .file-link:hover {
        text-decoration: underline;
      }
      .tree-more {
        margin-top: 0.25rem;
      }
      /* The viewers column is the only thing that scrolls. Each viewer grows to its text, and long lines wrap. */
      /* The chat keeps at least 24rem. The viewers ask for 32rem and shrink to make room, but not below 14rem. */
      #viewers {
        flex: 0 1 32rem;
        min-width: 14rem;
        height: 100vh;
        overflow-y: auto;
        padding: 1rem;
        box-sizing: border-box;
        border-left: 1px solid var(--line);
      }
      .viewers-head {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 0.5rem;
      }
      /* Tabs wrap onto more rows instead of scrolling sideways, so any number of them fits. */
      #viewers-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.75rem;
      }
      .viewer-tab {
        padding: 0.25rem 0.5rem;
        font-family: var(--mono);
        font-size: 0.8em;
        overflow-wrap: anywhere;
        text-align: left;
      }
      .viewer-tab.active {
        font-weight: 600;
        border-color: var(--muted);
      }
      .viewer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.85em;
      }
      .viewer-name {
        overflow-wrap: anywhere;
      }
      .viewer-more,
      .tree-more {
        margin-top: 0.5rem;
      }
      .viewer pre {
        margin: 0.5rem 0 0;
        padding: 0.5rem;
        background: var(--surface);
        border-radius: 0.4rem;
        font-family: var(--mono);
        font-size: 0.8em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #notes-list,
      #sessions-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #notes-list li,
      #sessions-list li {
        margin: 0.5rem 0;
      }
      #notes-list button,
      #sessions-list button {
        width: 100%;
        padding: 0.25rem 0.5rem;
        text-align: left;
        font-family: var(--mono);
        font-size: 0.85em;
      }
      #notes-list .description {
        margin: 0.2rem 0 0 0.5rem;
        font-size: 0.8em;
      }
      #session-form {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      #session-name {
        flex: 1;
        min-width: 0;
        font-size: 0.9em;
      }
      #notes-status,
      #sessions-status {
        margin: 0.5rem 0;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }
      #note-form {
        flex-direction: column;
        margin-top: 0.75rem;
      }
      #note-form label,
      .profile-choice {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.85em;
      }
      #note-form input,
      #note-form select,
      #note-form textarea,
      #profile-picker {
        width: 100%;
        font-size: 0.9em;
      }
      .profile-choice {
        margin-bottom: 0.5rem;
      }
      /* The editor grows to its text (see fitNoteContent), so the Notes pane is the only thing that scrolls. */
      #note-content {
        min-height: 10rem;
        overflow: hidden;
        resize: none;
        font-family: var(--mono);
      }
      #note-preview {
        min-height: 10rem;
        padding: 0.5rem;
        border: 1px solid var(--grid);
        border-radius: 0.4rem;
        box-sizing: border-box;
        width: 100%;
      }
      .note-actions {
        display: flex;
        gap: 0.5rem;
      }
      @media (max-width: 40rem) {
        .layout {
          flex-direction: column;
          height: auto;
        }
        main {
          height: 70vh;
          min-width: 0;
        }
        #divider {
          display: none;
        }
        aside {
          width: auto;
          height: auto;
          border-left: none;
          border-top: 1px solid var(--line);
        }
        .pane {
          flex: none;
        }
        #viewers {
          flex: none;
          height: auto;
          overflow: visible;
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <div id="log"></div>
        <form id="form">
          <input id="input" autocomplete="off" autofocus />
          <button type="submit" id="send">Send</button>
          <button type="button" id="stop" hidden>Stop</button>
          <button type="button" id="new">New</button>
        </form>
      </main>
      <section id="viewers" aria-label="Open files" hidden>
        <div class="viewers-head">
          <button type="button" id="viewers-close-all">Close all</button>
        </div>
        <div id="viewers-tabs"></div>
        <div id="viewers-body"></div>
      </section>
      <div id="divider" role="separator" aria-orientation="vertical" aria-label="Drag to resize the Tools panel"></div>
      <aside>
        <details class="pane" id="tools-section">
          <summary>Tools</summary>
          <p id="tools-error" class="error" hidden></p>
          <ul id="tools-list"></ul>
        </details>
        <details class="pane" id="sessions-section">
          <summary>Sessions</summary>
          <p id="sessions-status" hidden></p>
          <form id="session-form">
            <input id="session-name" autocomplete="off" placeholder="Name" aria-label="Session name" />
            <button type="submit" id="session-save">Save</button>
          </form>
          <ul id="sessions-list"></ul>
        </details>
        <details class="pane" id="files-section">
          <summary>Files</summary>
          <button type="button" id="files-refresh">Refresh</button>
          <div id="files-tree"></div>
        </details>
        <details class="pane" id="notes-section" open>
          <summary>Notes</summary>
          <p id="notes-status" hidden></p>
          <label class="profile-choice">Profile <select id="profile-picker"></select></label>
          <ul id="notes-list"></ul>
          <button type="button" id="notes-new">New note</button>
          <form id="note-form">
            <label>Scope
              <select id="note-scope">
                <option value="local">local</option>
                <option value="global">global</option>
              </select>
            </label>
            <label>Category <input id="note-category" autocomplete="off" /></label>
            <label>Name <input id="note-name" autocomplete="off" /></label>
            <textarea id="note-content" rows="12" spellcheck="false"></textarea>
            <div id="note-preview" class="markdown" hidden></div>
            <div class="note-actions">
              <button type="submit" id="note-save">Save</button>
              <button type="button" id="note-preview-toggle">Preview</button>
              <button type="button" id="note-delete" hidden>Delete</button>
            </div>
          </form>
        </details>
      </aside>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
      integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
      integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
      crossorigin="anonymous"
    ></script>
    <script src="/app.js"></script>
  </body>
</html>

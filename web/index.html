<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strata Chat</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #111;
      }
      .layout {
        display: flex;
        height: 100vh;
      }
      main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 48rem;
        margin: 0 auto;
        padding: 1rem;
        box-sizing: border-box;
      }
      #log {
        flex: 1;
        overflow-y: auto;
      }
      #log > div {
        margin: 0.5rem 0;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        white-space: pre-wrap;
      }
      .user {
        background: #e8f0fe;
      }
      .assistant {
        background: #f3f3f3;
      }
      .thinking {
        margin-bottom: 0.5rem;
        color: #666;
        font-size: 0.9em;
      }
      .thinking > div {
        white-space: pre-wrap;
      }
      .summary {
        color: #666;
        font-size: 0.85em;
        font-style: italic;
      }
      .tool {
        font-family: ui-monospace, monospace;
        font-size: 0.85em;
        color: #555;
        white-space: pre-wrap;
      }
      .markdown {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .markdown p {
        margin: 0.4rem 0;
      }
      .markdown h1,
      .markdown h2,
      .markdown h3 {
        font-size: 1.1em;
        margin: 0.6rem 0 0.3rem;
      }
      .markdown code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
        background: #ececec;
        padding: 0 0.2em;
        border-radius: 0.2rem;
      }
      .markdown pre {
        overflow-x: auto;
        padding: 0.5rem;
        background: #ececec;
        border-radius: 0.4rem;
      }
      .markdown pre code {
        background: none;
        padding: 0;
      }
      .markdown ul,
      .markdown ol {
        padding-left: 1.4rem;
      }
      .markdown blockquote {
        margin: 0.4rem 0;
        padding-left: 0.6rem;
        border-left: 3px solid #bbb;
        color: #555;
      }
      .markdown table {
        border-collapse: collapse;
      }
      .markdown th,
      .markdown td {
        border: 1px solid #ccc;
        padding: 0.2rem 0.4rem;
      }
      #note-preview {
        min-height: 10rem;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 0.4rem;
        box-sizing: border-box;
        width: 100%;
      }
      .error {
        background: #fde7e7;
        color: #8a1c1c;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      #input {
        flex: 1;
        min-width: 0;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      #divider {
        width: 6px;
        flex-shrink: 0;
        cursor: col-resize;
        touch-action: none;
        background: #ddd;
      }
      aside {
        width: var(--tools-width, 17rem);
        flex-shrink: 0;
        overflow-y: auto;
        padding: 1rem;
        box-sizing: border-box;
        border-left: 1px solid #ddd;
      }
      aside h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      #tools-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #tools-list li {
        margin: 0.75rem 0;
      }
      #tools-list label {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
      }
      #tools-list .description {
        margin: 0.25rem 0 0 1.5rem;
        color: #666;
        font-size: 0.85em;
      }
      #tools-error {
        margin: 0 0 0.5rem;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }
      #notes-section {
        margin-top: 1.5rem;
      }
      #notes-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #notes-list li {
        margin: 0.5rem 0;
      }
      #notes-list button {
        width: 100%;
        padding: 0.25rem 0.5rem;
        text-align: left;
        font-family: ui-monospace, monospace;
        font-size: 0.85em;
      }
      #notes-list .description {
        margin: 0.2rem 0 0 0.5rem;
        color: #666;
        font-size: 0.8em;
      }
      #notes-status {
        margin: 0.5rem 0;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }
      #note-form {
        flex-direction: column;
        margin-top: 0.75rem;
      }
      #note-form label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.85em;
      }
      #note-form input,
      #note-form select,
      #note-form textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 0.9em;
      }
      .profile-choice {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.5rem;
        font-size: 0.85em;
      }
      #profile-picker {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 0.9em;
      }
      #note-content {
        min-height: 10rem;
        font-family: ui-monospace, monospace;
      }
      .note-actions {
        display: flex;
        gap: 0.5rem;
      }
      @media (max-width: 40rem) {
        .layout {
          flex-direction: column;
          height: auto;
        }
        main {
          height: 70vh;
        }
        #divider {
          display: none;
        }
        aside {
          width: auto;
          border-left: none;
          border-top: 1px solid #ddd;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1b1b;
          color: #eee;
        }
        .user {
          background: #263247;
        }
        .assistant {
          background: #2a2a2a;
        }
        .tool {
          color: #aaa;
        }
        .error {
          background: #4a1f1f;
          color: #ffb4b4;
        }
        #input {
          background: #222;
          color: #eee;
          border: 1px solid #444;
        }
        aside {
          border-color: #444;
        }
        #divider {
          background: #444;
        }
        #profile-picker {
          background: #222;
          color: #eee;
          border: 1px solid #444;
        }
        .markdown code {
          background: #333;
        }
        .markdown pre {
          background: #333;
        }
        .markdown blockquote {
          border-left-color: #555;
          color: #aaa;
        }
        .markdown th,
        .markdown td {
          border-color: #555;
        }
        #note-preview {
          border-color: #444;
        }
        #note-form input,
        #note-form select,
        #note-form textarea {
          background: #222;
          color: #eee;
          border: 1px solid #444;
        }
        #tools-list .description {
          color: #aaa;
        }
        @media (max-width: 40rem) {
          aside {
            border-top-color: #444;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main>
        <div id="log"></div>
        <form id="form">
          <input id="input" autocomplete="off" autofocus />
          <button type="submit" id="send">Send</button>
          <button type="button" id="stop" hidden>Stop</button>
          <button type="button" id="new">New</button>
        </form>
      </main>
      <div id="divider" role="separator" aria-orientation="vertical" aria-label="Drag to resize the Tools panel"></div>
      <aside>
        <h2>Tools</h2>
        <p id="tools-error" class="error" hidden></p>
        <ul id="tools-list"></ul>
        <section id="notes-section">
          <h2>Notes</h2>
          <p id="notes-status" hidden></p>
          <label class="profile-choice">Profile <select id="profile-picker"></select></label>
          <ul id="notes-list"></ul>
          <button type="button" id="notes-new">New note</button>
          <form id="note-form">
            <label>Scope
              <select id="note-scope">
                <option value="local">local</option>
                <option value="global">global</option>
              </select>
            </label>
            <label>Category <input id="note-category" autocomplete="off" /></label>
            <label>Name <input id="note-name" autocomplete="off" /></label>
            <textarea id="note-content" rows="12" spellcheck="false"></textarea>
            <div id="note-preview" class="markdown" hidden></div>
            <div class="note-actions">
              <button type="submit" id="note-save">Save</button>
              <button type="button" id="note-preview-toggle">Preview</button>
              <button type="button" id="note-delete" hidden>Delete</button>
            </div>
          </form>
        </section>
      </aside>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
